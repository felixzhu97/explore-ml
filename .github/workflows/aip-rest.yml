name: AIP REST guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aip-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check legacy envelopes
        run: bash scripts/check-aip-rest.sh
